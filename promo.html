<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oferta Especial | Angel Curbelo Sales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d4af37;
            --primary-glow: rgba(212, 175, 55, 0.4);
        }
        .promo-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: radial-gradient(circle at center, #111 0%, #050505 100%);
            position: relative;
        }
        .promo-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 3.5rem 3rem;
            border-radius: 30px;
            max-width: 650px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .promo-tag {
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 6px 16px;
            border-radius: 99px;
            align-self: center;
        }
        .promo-title {
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.15;
            color: #fff;
        }
        .promo-subtitle {
            font-size: 1.2rem;
            color: #aaa;
            line-height: 1.6;
        }
        .promo-badge {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 1.5rem;
            margin: 1rem 0;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            border-left: 5px solid var(--primary);
        }
        .promo-btn {
            background: var(--primary);
            color: #000;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 1.2rem;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 25px var(--primary-glow);
            text-decoration: none;
            display: inline-block;
        }
        .promo-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px var(--primary-glow);
        }
        .loading-dots:after {
            content: ' .';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ' .'; }
            40% { content: ' ..'; }
            60% { content: ' ...'; }
            80%, 100% { content: ''; }
        }
        @media (max-width: 640px) {
            .promo-card { padding: 2.5rem 1.5rem; }
            .promo-title { font-size: 2rem; }
            .promo-subtitle { font-size: 1rem; }
            .promo-badge { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="promo-container">
        <div class="promo-card" id="promo-content">
            <h2 class="promo-subtitle loading-dots">Cargando oferta especial</h2>
        </div>
    </div>

    <script type="module">
        import { db } from '/src/firebase-config.js';
        import { doc, getDoc } from 'firebase/firestore';

        async function initPromo() {
            const urlParams = new URLSearchParams(window.location.search);
            const promoId = urlParams.get('id');
            const contentEl = document.getElementById('promo-content');

            if (!promoId) {
                contentEl.innerHTML = `
                    <span class="promo-tag" style="color:#ff4d4d; border-color:#ff4d4d33;">⚠️ ERROR</span>
                    <h1 class="promo-title">Enlace Inválido</h1>
                    <p class="promo-subtitle">No se ha especificado un identificador de campaña en el enlace.</p>
                `;
                return;
            }

            try {
                const docRef = doc(db, 'landings_config', promoId.toUpperCase());
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // Aplicar color enfoque personalizado
                    const color = data.color_enfoque || '#d4af37';
                    document.documentElement.style.setProperty('--primary', color);
                    
                    // Convertir color HEX/HSL en glow RGBA aproximado
                    if (color.startsWith('#')) {
                        const r = parseInt(color.slice(1, 3), 16);
                        const g = parseInt(color.slice(3, 5), 16);
                        const b = parseInt(color.slice(5, 7), 16);
                        document.documentElement.style.setProperty('--primary-glow', `rgba(${r}, ${g}, ${b}, 0.4)`);
                    }

                    // Renderizar contenido
                    contentEl.innerHTML = `
                        <span class="promo-tag">OFERTA ACTIVA</span>
                        <h1 class="promo-title">${data.titulo || ''}</h1>
                        <p class="promo-subtitle">${data.subtitulo || ''}</p>
                        <div class="promo-badge">${data.oferta_especial || ''}</div>
                        <a href="${data.formulario_destino || '/cuestionario.html'}" class="promo-btn">Más Información</a>
                        <small style="color: #666; font-size: 0.75rem; margin-top: 1rem;">Angel Curbelo Sales • Asesoría Premium</small>
                    `;
                } else {
                    contentEl.innerHTML = `
                        <span class="promo-tag" style="color:#ff4d4d; border-color:#ff4d4d33;">⚠️ ERROR</span>
                        <h1 class="promo-title">Oferta no encontrada</h1>
                        <p class="promo-subtitle">La promoción o campaña solicitada ya no se encuentra activa o no existe.</p>
                    `;
                }
            } catch (error) {
                console.error("Error cargando oferta de Firestore:", error);
                contentEl.innerHTML = `
                    <span class="promo-tag" style="color:#ff4d4d; border-color:#ff4d4d33;">⚠️ ERROR</span>
                    <h1 class="promo-title">Error del Servidor</h1>
                    <p class="promo-subtitle">Hubo un problema al cargar los detalles de la oferta. Por favor, intente más tarde.</p>
                `;
            }
        }

        initPromo();
    </script>
</body>
</html>
